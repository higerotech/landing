services:
  web:
    build: .
    image: higerotech/landing:latest
    container_name: higerotech-landing
    ports:
      - "8080:80"          # http://localhost:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
