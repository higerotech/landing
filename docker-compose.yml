services:
  web:
    build: .
    image: higerotech/landing:latest
    container_name: higerotech-landing
    ports:
      - "8080:80"          # http://localhost:8080
    restart: unless-stopped

    # Endurecimiento: el contenedor sirve archivos estáticos, no necesita
    # escribir en su propio sistema de archivos ni escalar privilegios.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
