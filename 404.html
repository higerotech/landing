<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — Higerotech</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#15181B" />
  <link rel="icon" type="image/svg+xml" href="/assets/isotipo.svg" />
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  <style>
    :root {
      --ink: #15181B; --teal: #8AD6CC; --coral: #F97171;
      --text: #E7ECEF; --text-muted: #97A4AE; --border-2: rgba(255,255,255,0.14);
      --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-display: 'Space Grotesk', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--ink); color: var(--text); font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased; padding: 32px; text-align: center;
      background-image:
        radial-gradient(circle at 70% 20%, rgba(138,214,204,0.12) 0%, transparent 55%),
        radial-gradient(circle at 20% 85%, rgba(249,113,113,0.08) 0%, transparent 50%);
    }
    a { text-decoration: none; }
    :focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; border-radius: 4px; }
    .wrap { max-width: 520px; }
    img.iso { width: 96px; height: 96px; margin: 0 auto 30px; display: block; }
    .code {
      font-family: var(--font-display); font-size: 76px; font-weight: 700;
      letter-spacing: -0.04em; color: var(--teal); line-height: 1;
    }
    h1 {
      font-family: var(--font-display); font-size: 25px; font-weight: 600;
      margin: 16px 0 12px; letter-spacing: -0.02em;
    }
    p { font-size: 16px; color: var(--text-muted); line-height: 1.65; margin-bottom: 34px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 9px; border-radius: 100px;
      font-size: 15px; font-weight: 700; padding: 13px 26px; transition: all .2s ease;
    }
    .btn-primary {
      background: var(--teal); color: var(--ink);
      box-shadow: 0 6px 26px rgba(138,214,204,0.28);
    }
    .btn-primary:hover { background: #9FE0D7; transform: translateY(-2px); }
    .btn-secondary { color: var(--text); border: 1.5px solid var(--border-2); font-weight: 600; }
    .btn-secondary:hover { border-color: var(--teal); color: var(--teal); transform: translateY(-2px); }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="iso" src="/assets/isotipo.svg" alt="" role="presentation" />
    <div class="code">404</div>
    <h1>Esta página no existe</h1>
    <p>El enlace que seguiste no lleva a ninguna parte. Nuestros sistemas sí siguen en pie.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Volver al inicio</a>
      <a href="mailto:contacto@higerotech.com" class="btn btn-secondary">Escribirnos</a>
    </div>
  </main>
</body>
</html>
