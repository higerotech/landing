# ── Cabeceras de seguridad ───────────────────────────────────────────────
# Este archivo se incluye en CADA `location`, no solo en `server`.
#
# Motivo: en nginx las directivas `add_header` se heredan del nivel superior
# SOLO si el nivel actual no define ninguna `add_header` propia. Como varios
# `location` añaden su propio `Cache-Control`, declararlas únicamente en
# `server` hacía que se perdieran justo donde más importan — incluida la
# página principal, que resuelve a `location = /index.html`.
#
# Verificación:  curl -sI http://localhost/ | grep -i -E 'frame|nosniff|referrer|permissions|content-security'

add_header X-Frame-Options        "DENY"                              always;
add_header X-Content-Type-Options "nosniff"                           always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin"                 always;
# `$corp` vale "same-origin" en todo el sitio y "cross-origin" en los tres
# assets de marca que deben poder incrustarse desde fuera. La lista está en el
# `map` de `nginx.conf`, junto a su porqué. Es una sola cabecera con el valor
# que toque: un segundo `add_header` habría acumulado dos valores.
add_header Cross-Origin-Resource-Policy "$corp"                       always;
# Completa la tríada COOP/COEP/CORP. Es seguro aquí precisamente porque el
# sitio no carga nada de otro origen (ADR-0004): `require-corp` rompería
# cualquier recurso cross-origin sin CORP, y no hay ninguno. Detectado como
# ausente por el escaneo DAST (ZAP 90004).
add_header Cross-Origin-Embedder-Policy "require-corp"                always;

# CSP: tras autoalojar las fuentes, todo el contenido es del mismo origen.
#
# `script-src` ya NO lleva 'unsafe-inline': el JS salió de index.html a
# `assets/sitio.js` (ADR-0007) y no queda ni un bloque ejecutable inline ni un
# manejador `on*=` en el marcado. Lo vigila U11.8, porque el día que alguien
# devuelva un `<script>` al HTML el navegador lo bloqueará en silencio y la
# página se quedará con `.reveal` en opacity:0.
#
# `style-src` sí lo conserva: el CSS sigue dentro de index.html por ADR-0003.
# Media deuda T4 pagada, media viva.
#
# El <script type="application/ld+json"> no cuenta: es un bloque de datos, el
# parser no lo prepara como script y la CSP no lo evalúa. E5.1 lo confirma
# contra un navegador de verdad, que es donde importa.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
