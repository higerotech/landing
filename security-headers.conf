# ── Cabeceras de seguridad ───────────────────────────────────────────────
# Este archivo se incluye en CADA `location`, no solo en `server`.
#
# Motivo: en nginx las directivas `add_header` se heredan del nivel superior
# SOLO si el nivel actual no define ninguna `add_header` propia. Como varios
# `location` añaden su propio `Cache-Control`, declararlas únicamente en
# `server` hacía que se perdieran justo donde más importan — incluida la
# página principal, que resuelve a `location = /index.html`.
#
# Verificación:  curl -sI http://localhost/ | grep -i -E 'frame|nosniff|referrer|permissions|content-security'

add_header X-Frame-Options        "DENY"                              always;
add_header X-Content-Type-Options "nosniff"                           always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin"                 always;
# `$corp` vale "same-origin" en todo el sitio y "cross-origin" en los tres
# assets de marca que deben poder incrustarse desde fuera. La lista está en el
# `map` de `nginx.conf`, junto a su porqué. Es una sola cabecera con el valor
# que toque: un segundo `add_header` habría acumulado dos valores.
add_header Cross-Origin-Resource-Policy "$corp"                       always;
# Completa la tríada COOP/COEP/CORP. Es seguro aquí precisamente porque el
# sitio no carga nada de otro origen (ADR-0004): `require-corp` rompería
# cualquier recurso cross-origin sin CORP, y no hay ninguno. Detectado como
# ausente por el escaneo DAST (ZAP 90004).
add_header Cross-Origin-Embedder-Policy "require-corp"                always;

# CSP: tras autoalojar las fuentes, todo el contenido es del mismo origen.
# `unsafe-inline` sigue siendo necesario porque el CSS y el JS viven dentro
# de index.html (decisión de arquitectura, ver ADR-0003). Se elimina en el
# momento en que se extraigan a archivos propios.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
