name: AI-DLC Security Gates

# ── Política de anclado de acciones ──────────────────────────────────────
# · Acciones oficiales (`actions/*`): por tag de major. Las publica GitHub y
#   mover un tag de major requeriría comprometer la propia plataforma.
# · Acciones de TERCEROS: por SHA de commit, con el tag en un comentario al
#   lado. Un tag lo puede repuntar su dueño en cualquier momento, y estas
#   acciones ejecutan código en el CI: quien controle el tag ejecuta lo que
#   quiera. Es el mismo criterio que se aplicó a `trivy-action` cuando estaba
#   en `@master`.
#
# ── Runtime ──────────────────────────────────────────────────────────────
# Todas corren en **node24**. Desde el 2026-06-02 GitHub fuerza las acciones
# de Node 20 sobre Node 24 con un aviso de deprecación, y el **2026-09-16
# retira Node 20 de los runners**: entonces dejarían de funcionar. Al elegir
# versión no se cogió la más nueva por serlo, sino la major más antigua que ya
# fuera node24 **y** llevara meses en circulación. Detalle en `CHANGELOG.md`.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Gate 2 · Construcción y configuración ────────────────────────────
  build:
    name: Build + validar nginx.conf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # `RUN nginx -t` dentro del Dockerfile hace que una configuración
      # inválida rompa aquí y no en producción.
      - name: Construir imagen
        run: docker build -t higerotech/landing:ci .

      - name: Guardar imagen para los jobs siguientes
        run: docker save higerotech/landing:ci -o /tmp/landing.tar

      - uses: actions/upload-artifact@v7
        with:
          name: imagen
          path: /tmp/landing.tar
          retention-days: 1

  # ── Gate 2 · Secretos ────────────────────────────────────────────────
  secrets:
    name: Detección de secretos
    runs-on: ubuntu-latest
    # `contents: read` del bloque global no basta: el action lee los commits y
    # los comentarios de la PR y publica los hallazgos como review comments.
    # Sin esto falla con «Resource not accessible by integration». Se declara
    # por job para que los otros cuatro sigan sin tocar la API de PRs.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `gitleaks-action` exige licencia en repos de organización. Sin esta
          # variable el job aborta antes de escanear un solo commit, y el gate
          # aparenta cubrir los secretos sin haber mirado nada.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Gate 2 · SAST ────────────────────────────────────────────────────
  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/security-audit
            p/xss

  # ── Gate 4 · Escaneo de contenedor + SBOM ────────────────────────────
  container:
    name: Container scan + SBOM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: imagen
          path: /tmp
      - run: docker load -i /tmp/landing.tar

      # Anclado por SHA de commit y no por tag: un tag lo puede repuntar el
      # dueño del repo, y `@master` movía con cada commit. Este job es el que
      # avala las imágenes que se despliegan, así que quien controlase esa rama
      # ejecutaba código aquí. Al subir versión, cambiar SHA y comentario juntos.
      - name: Trivy — vulnerabilidades
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: higerotech/landing:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy — SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: higerotech/landing:ci
          format: cyclonedx
          output: sbom.cdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json

  # ── Gate 4 · Cabeceras de seguridad ──────────────────────────────────
  # Este job es el que evita que vuelva a ocurrir el bug de herencia de
  # `add_header`: comprueba las cabeceras en la home Y en un asset.
  headers:
    name: Cabeceras de seguridad y códigos HTTP
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: imagen
          path: /tmp
      - run: docker load -i /tmp/landing.tar

      - name: Levantar el sitio
        run: |
          docker run -d --name sitio -p 8080:80 higerotech/landing:ci
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 1
          done

      - name: Verificar cabeceras en cada tipo de ruta
        run: |
          set -euo pipefail
          fallos=0
          for ruta in / /index.html /assets/fonts/fonts.css /robots.txt; do
            cab=$(curl -sI "http://localhost:8080$ruta")
            for h in "X-Frame-Options" "X-Content-Type-Options" "Referrer-Policy" \
                     "Permissions-Policy" "Content-Security-Policy"; do
              if ! grep -qi "^$h:" <<<"$cab"; then
                echo "::error::falta $h en $ruta"
                fallos=$((fallos+1))
              fi
            done
          done
          exit $fallos

      - name: Una ruta inexistente debe devolver 404, no 200
        run: |
          set -euo pipefail
          for ruta in /no-existe /assets/no-existe.png; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$ruta")
            [ "$codigo" = "404" ] || { echo "::error::$ruta devolvió $codigo"; exit 1; }
          done

      - name: No debe filtrarse la versión de nginx
        run: |
          set -euo pipefail
          servidor=$(curl -sI http://localhost:8080/ | grep -i '^Server:' || true)
          grep -qiE 'nginx/[0-9]' <<<"$servidor" && { echo "::error::$servidor"; exit 1; } || true

      - if: always()
        run: docker rm -f sitio

  # ── Gate 3 · Pruebas unitarias ───────────────────────────────────────
  # Corren en paralelo con los jobs de contenedor y no como prerrequisito: los
  # cinco jobs duran menos de un minuto, así que encadenarlos solo añadiría
  # latencia a cada ejecución sin ahorrar nada apreciable de runner.
  unit:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: node --test sobre el index.html real
        run: npm test

      # `--experimental-test-coverage` de Node no vale aquí: su reporter solo
      # incluye rutas de archivo y el JS del sitio vive en un <script> inline,
      # así que informaba «100 %» midiendo únicamente el arnés. Este medidor lee
      # los datos crudos de V8, que sí registran el script. Gatea sobre
      # funciones; el porcentaje de líneas es informativo y una cota inferior.
      - name: Cobertura del script inline
        run: npm run coverage

  # ── Gate 2 · Dependencias (SCA) ──────────────────────────────────────
  # Este gate era «N/A por ausencia» hasta que las pruebas introdujeron jsdom.
  # Matiz que conviene tener presente al leer un rojo aquí: todas las
  # dependencias son de desarrollo y ninguna viaja en la imagen —el Dockerfile
  # copia archivos concretos—, así que un hallazgo es riesgo de la cadena de
  # herramientas del CI, no del sitio publicado. Sigue mereciendo arreglo.
  deps:
    name: Dependencias (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Auditoría de vulnerabilidades
        run: npm audit --audit-level=high

  # ── Gate 3 · E2E y accesibilidad ─────────────────────────────────────
  # Corren contra el CONTENEDOR, no contra un servidor de ficheros: es lo que
  # hace que las cabeceras, los 404 y la CSP sean los de nginx. Por eso este
  # job reconstruye la imagen en vez de reutilizar el artefacto de `build`:
  # necesita el contexto completo y tarda lo mismo que descargarlo.
  e2e:
    name: E2E + accesibilidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Instalar Chromium
        run: npm run e2e:install

      - name: Levantar el sitio
        run: |
          docker build -t higerotech/landing:e2e .
          docker run -d --name sitio-e2e -p 8080:80 higerotech/landing:e2e
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8080/ || { echo "::error::el sitio no levantó"; exit 1; }

      - name: Playwright
        run: npm run e2e
        env:
          BASE_URL: http://localhost:8080

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - if: always()
        run: docker rm -f sitio-e2e

  # ── Gate 3 · Rendimiento ─────────────────────────────────────────────
  # Presupuesto del charter: LCP < 2,5 s en 3G lento y < 350 KB de primera
  # carga. Mide con throttling REAL y no simulado, y toma la mediana de tres
  # ejecuciones: la varianza medida entre ejecuciones de la misma página llega
  # a 270 ms, así que un gate sobre una sola medición sería una moneda al aire.
  perf:
    name: Presupuesto de rendimiento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Lighthouse reutiliza este mismo Chromium vía CHROME_PATH.
      - name: Instalar Chromium
        run: npm run e2e:install

      - name: Levantar el sitio
        run: |
          docker build -t higerotech/landing:perf .
          docker run -d --name sitio-perf -p 8081:80 higerotech/landing:perf
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8081/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8081/ || { echo "::error::el sitio no levantó"; exit 1; }

      - name: Lighthouse
        run: npm run perf
        env:
          BASE_URL: http://localhost:8081

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: coverage/lighthouse/
          retention-days: 7

      - if: always()
        run: docker rm -f sitio-perf

  # ── Gate 3 · Seguridad dinámica (DAST) ───────────────────────────────
  # Un contenedor escaneando a otro. Se usa la imagen oficial de ZAP por
  # Docker y no la acción de GitHub, para que el comando sea el mismo aquí y
  # en la máquina de quien lo depura.
  #
  # `zap-baseline.py` sale con código 2 ante cualquier aviso nuevo, así que
  # `.zap/rules.tsv` es la lista completa y explícita de lo aceptado: nada se
  # silencia sin un motivo escrito.
  dast:
    name: DAST (ZAP baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Levantar el sitio
        run: |
          docker build -t higerotech/landing:dast .
          docker run -d --name sitio-dast -p 8082:80 higerotech/landing:dast
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8082/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8082/ || { echo "::error::el sitio no levantó"; exit 1; }

      - name: ZAP baseline
        run: npm run dast
        env:
          PUERTO: '8082'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap
          path: coverage/zap/
          retention-days: 7

      - if: always()
        run: docker rm -f sitio-dast
