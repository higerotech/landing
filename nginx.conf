# No filtrar la versión de nginx en la cabecera Server ni en las páginas de error.
server_tokens off;

# ── Assets de marca incrustables desde otros orígenes ────────────────────
# Tres imágenes públicas —isotipo en carbón, tarjeta social y logotipo— deben
# poder cargarse desde otros sitios. Lo que lo impedía es
# `Cross-Origin-Resource-Policy: same-origin`; `Referrer-Policy` no bloquea
# nada, solo recorta la cabecera `Referer`.
#
# Se hace con un `map` y NO con un `add_header` extra en un `location` propio,
# por la misma razón que existe ADR-0002: `add_header` **acumula**. Añadir un
# segundo CORP dejaría la respuesta con dos valores contradictorios, que es
# peor que no tocar nada — el navegador no reconoce el resultado combinado.
# Con un `map` sale UNA cabecera cuyo valor depende de la ruta.
#
# U12.4 comprueba que esta lista coincida con `run_worker_first` de
# `wrangler.jsonc`: son los dos caminos a producción y no hay build que los
# sincronice.
map $uri $corp {
    default                        "same-origin";
    /assets/isotipo_charcoal.svg   "cross-origin";
    /assets/og-card.png            "cross-origin";
    /assets/logo_white_trans.png   "cross-origin";
}

# Derivado del anterior para no repetir la lista: donde CORP abre, se emite
# también `Access-Control-Allow-Origin`. Con valor vacío nginx omite la
# cabecera, así que el resto del sitio no la lleva.
#
# ACAO no hace falta para un `<img>` —de eso se ocupa CORP— pero sí para
# `fetch()` y para dibujar en un `<canvas>` sin contaminarlo.
map $corp $acao {
    "same-origin"    "";
    "cross-origin"   "*";
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # ── Compresión ───────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml
        application/xml+rss;
    # woff2 ya viene comprimido: volver a comprimirlo solo gasta CPU.

    # ── Caché de assets estáticos ────────────────────────────────
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        # Solo add_header: `expires` emitiria un segundo Cache-Control duplicado.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Imágenes sueltas fuera de /assets/
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        # Solo add_header: `expires` emitiria un segundo Cache-Control duplicado.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    # ── HTML sin caché (siempre la última versión) ───────────────
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ── Archivos de indexación ───────────────────────────────────
    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1d;
        access_log off;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1d;
        access_log off;
    }

    # ── Ruteo principal ──────────────────────────────────────────
    # Sitio de una sola página: no hay rutas cliente que rescatar, así que
    # una URL inexistente debe devolver 404 de verdad. El `try_files … /index.html`
    # anterior respondía 200 con la landing para CUALQUIER ruta, lo que los
    # buscadores tratan como soft 404 y penalizan.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # Página de error con el estado correcto (404, no 200).
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }

    # Sin favicon propio no ensuciamos el log de errores.
    location = /favicon.ico { access_log off; log_not_found off; }

    # Bloquear acceso a ocultos (.git, .env) por si acaban en la imagen.
    location ~ /\. { deny all; access_log off; log_not_found off; }
}
