# No filtrar la versión de nginx en la cabecera Server ni en las páginas de error.
server_tokens off;

# ── Registro sin dirección IP ────────────────────────────────────────────
# Decisión del 2026-09-16, al publicar la política de privacidad: el formato
# `combined` de nginx empieza por `$remote_addr`, y una IP es dato personal.
# Este formato omite la IP y el `X-Forwarded-For`, y conserva lo que de verdad
# se usa para diagnosticar: qué se pidió, qué se respondió, cuánto tardó y con
# qué navegador.
#
# El precio es real y se asume: sin IP no se puede distinguir un rastreo
# abusivo de tráfico legítimo repartido, ni correlacionar peticiones de un mismo
# visitante. Se cambia capacidad de diagnóstico por no custodiar el único dato
# personal que el servidor veía.
#
# Lo que esto habilita es que la política de privacidad pueda decir —y sea
# verdad— que el sitio no conserva direcciones IP. Por el camino del Worker
# tampoco: la retención de logs de Cloudflare no está habilitada. Si algún día
# se vuelve a registrar la IP, hay que cambiar la política ANTES, no después.
log_format sin_ip '$time_iso8601 "$request" $status $body_bytes_sent '
                  '"$http_user_agent" $request_time';

access_log /var/log/nginx/access.log sin_ip;

# ── Assets de marca incrustables desde otros orígenes ────────────────────
# Tres imágenes públicas —isotipo en carbón, tarjeta social y logotipo— deben
# poder cargarse desde otros sitios. Lo que lo impedía es
# `Cross-Origin-Resource-Policy: same-origin`; `Referrer-Policy` no bloquea
# nada, solo recorta la cabecera `Referer`.
#
# Se hace con un `map` y NO con un `add_header` extra en un `location` propio,
# por la misma razón que existe ADR-0002: `add_header` **acumula**. Añadir un
# segundo CORP dejaría la respuesta con dos valores contradictorios, que es
# peor que no tocar nada — el navegador no reconoce el resultado combinado.
# Con un `map` sale UNA cabecera cuyo valor depende de la ruta.
#
# U12.4 comprueba que esta lista coincida con `run_worker_first` de
# `wrangler.jsonc`: son los dos caminos a producción y no hay build que los
# sincronice.
map $uri $corp {
    default                        "same-origin";
    /assets/isotipo_charcoal.svg   "cross-origin";
    /assets/og-card.png            "cross-origin";
    /assets/logo_white_trans.png   "cross-origin";
}


server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # ── Compresión ───────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml
        application/xml+rss;
    # woff2 ya viene comprimido: volver a comprimirlo solo gasta CPU.

    # ── Caché de assets estáticos ────────────────────────────────
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        # Solo add_header: `expires` emitiria un segundo Cache-Control duplicado.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Imágenes sueltas fuera de /assets/
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        # Solo add_header: `expires` emitiria un segundo Cache-Control duplicado.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    # ── HTML sin caché (siempre la última versión) ───────────────
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ── El CSS de las páginas legales, igual que el JS ───────────
    # Mismo razonamiento que el bloque de abajo: está dentro de /assets/, pero
    # no puede quedarse `immutable` 30 días mientras el HTML que lo usa se
    # revalida en cada visita. U12.5 comprueba las dos reglas.
    location = /assets/legal.css {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ── El JS va con el HTML, no con los assets ──────────────────
    # `assets/sitio.js` está dentro de /assets/, pero NO puede heredar el
    # `immutable` de 30 días de ese directorio: el HTML se revalida en cada
    # visita y el JS se quedaría congelado un mes junto a una página nueva.
    # Con el JS dentro de index.html este problema no existía, porque los dos
    # viajaban en la misma respuesta; extraerlo (ADR-0007) lo crea.
    #
    # Es un `location =`, que gana a cualquier prefijo o regex, así que la
    # regla no depende del orden del archivo. En el camino del Worker la
    # política la comparten sin hacer nada: `cloudflare/_headers` no fija
    # `Cache-Control` ni para el HTML ni para el JS.
    #
    # Si el archivo se renombra, esta regla hay que moverla con él: U2.7
    # comprueba que siga apuntando al script que index.html carga.
    location = /assets/sitio.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ── Archivos de indexación ───────────────────────────────────
    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1d;
        access_log off;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1d;
        access_log off;
    }

    # ── Ruteo principal ──────────────────────────────────────────
    # Sitio de una sola página: no hay rutas cliente que rescatar, así que
    # una URL inexistente debe devolver 404 de verdad. El `try_files … /index.html`
    # anterior respondía 200 con la landing para CUALQUIER ruta, lo que los
    # buscadores tratan como soft 404 y penalizan.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # Página de error con el estado correcto (404, no 200).
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }

    # Sin favicon propio no ensuciamos el log de errores.
    location = /favicon.ico { access_log off; log_not_found off; }

    # Bloquear acceso a ocultos (.git, .env) por si acaban en la imagen.
    location ~ /\. { deny all; access_log off; log_not_found off; }
}
